<!doctype html>
<!-- 地学基礎マスター：今日のステージへ下余白広め・その他コンパクト調整版 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地学基礎マスター</title>
<style>
:root{--bg:#edf3f4;--ink:#25323a;--sub:#6b7880;--card:#fff;--line:#dde6e9;--accent:#3e7c88;--good:#2b9a65;--bad:#d85a67}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:linear-gradient(160deg,#eaf6f1,#eef0fa);color:var(--ink);min-height:100vh;padding:14px}
button{font:inherit;cursor:pointer}
.app{width:min(760px,100%);margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}
.brand{font-weight:900;font-size:clamp(22px,5vw,31px)} .pill{font-weight:800;background:#ffffffb8;padding:8px 12px;border-radius:999px}
.card{background:rgba(255,255,255,.96);border:1px solid #fff;border-radius:26px;padding:clamp(18px,4vw,30px);box-shadow:0 16px 40px rgba(44,64,75,.14)}
.hidden{display:none!important}
.logo-banner{display:block;width:100%;max-width:680px;height:auto;margin:0 auto 14px;border-radius:14px}
.home-copy{text-align:center;margin:0 0 4px;color:var(--sub);font-weight:700}
.hero{text-align:center} .hero-icon{font-size:64px} h1{font-size:clamp(32px,8vw,50px);margin:8px 0} h2{line-height:1.5} p{color:var(--sub);line-height:1.75}
.primary,.secondary{width:100%;border:0;border-radius:17px;padding:16px;font-weight:900;font-size:18px;margin-top:13px}
.primary{color:#fff;background:linear-gradient(135deg,#477f8d,#5da89c);box-shadow:0 8px 20px #477f8d33}
.secondary{color:#386f7d;background:#e8f3f2}
.today{margin-top:22px;border:2px solid #8bb7b1;border-radius:24px;padding:20px;background:linear-gradient(160deg,#fff,#f2faf8)}
.today-top{display:flex;gap:14px;align-items:center} .today-icon{font-size:50px} .eyebrow{font-size:13px;color:var(--sub);font-weight:900} .today-title{font-size:23px;font-weight:950;margin-top:3px}
.small{font-size:13px;color:var(--sub)}
.map{display:grid;gap:16px;margin-top:20px}
.field-row{border:2px solid var(--line);border-radius:22px;padding:16px;background:#fff}
.field-row.locked{background:linear-gradient(135deg,#f6f7f8,#eceff1);color:#89949a}
.field-head{display:flex;align-items:center;gap:12px} .field-icon{font-size:38px} .field-name{font-size:20px;font-weight:950} .field-sub{font-size:12px;color:var(--sub)}
.stage-track{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.stage-node{min-height:90px;border:2px solid var(--line);border-radius:17px;background:#fff;padding:10px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center}
.stage-node.current{border-color:#5da89c;box-shadow:0 0 0 4px #5da89c1e}
.stage-node.done{background:#edf9f3;border-color:#70b994}
.stage-node.locked{background:#e5e8ea;border-color:#d3d9dc;color:#7b858b}
.node-icon{font-size:28px} .node-title{font-weight:900;font-size:13px;margin-top:5px} .node-note{font-size:10px;color:var(--sub);margin-top:3px}
.back{background:none;border:0;color:var(--accent);font-weight:900;padding:8px 0;margin-bottom:10px}
.status{display:flex;justify-content:space-between;font-weight:900;gap:10px} .progress{height:10px;background:#e9eef0;border-radius:99px;overflow:hidden;margin:12px 0 22px} .progress>div{height:100%;background:linear-gradient(90deg,#4c8895,#77b8ae);width:0;transition:.25s}
.choices{display:grid;gap:11px;margin-top:20px} .choice{border:2px solid var(--line);border-radius:15px;padding:15px;background:#fff;text-align:left;font-weight:800;line-height:1.5} .choice.correct{background:#e9f8f0;border-color:var(--good);color:#176640} .choice.wrong{background:#fff0f2;border-color:var(--bad);color:#9d3340} .choice:disabled{cursor:default}
.feedback{margin-top:16px;padding:15px;border-radius:16px;background:#f6f8f9;line-height:1.7} .feedback strong{display:block;margin-bottom:4px} .good strong{color:var(--good)} .bad strong{color:var(--bad)}
.result-score{text-align:center;font-size:62px;font-weight:950;color:#477f8d} .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0} .summary div{padding:13px;border-radius:15px;text-align:center;background:#f4f7f8} .summary strong{display:block;font-size:24px}
.unlock{background:linear-gradient(145deg,#fff8d8,#fff);border:2px solid #efcf63;border-radius:20px;padding:17px;text-align:center;margin:18px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#25323a;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;width:min(90vw,520px);text-align:center;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.notice{font-size:13px;background:#f4f7f8;padding:13px;border-radius:14px;margin-top:18px}
@media(max-width:520px){.stage-track{gap:6px} .stage-node{min-height:84px;padding:7px} .node-title{font-size:12px}}

/* 問題画面：上部情報をコンパクトに配置 */
#quiz{
  padding-top:16px;
}
#quiz .back{
  padding:2px 0;
  margin-bottom:6px;
  line-height:1.35;
}
#quiz .status{
  align-items:center;
  line-height:1.3;
}
#quiz .progress{
  margin:7px 0 9px;
}
#quiz #quizLabel{
  margin-bottom:4px!important;
  padding:6px 10px;
  font-size:15px;
}
#quiz #qtext{
  margin:10px 0 0;
  line-height:1.45;
}
#quiz .choices{
  margin-top:14px;
}

@media(max-width:520px){
  header{
    padding-bottom:9px;
  }
  #quiz{
    padding:15px 18px 20px;
  }
  #quiz .back{
    margin-bottom:5px;
  }
  #quiz .progress{
    margin:6px 0 8px;
  }
  #quiz #qtext{
    margin-top:8px;
  }
}


/* 調整版：
   「今日のステージへ」の下余白は広め、
   それ以外はコンパクト試作版の間隔を維持 */
#quiz .back{
  padding:10px 0;
  margin-bottom:14px;
  min-height:44px;
  display:flex;
  align-items:center;
  line-height:1.35;
}

@media(max-width:520px){
  #quiz .back{
    padding:10px 0;
    margin-bottom:14px;
    min-height:44px;
  }
}



/* 更新情報 */
.new-badge{
  display:none;
  margin:5px 0 0;
  color:var(--sub);
  font-size:12px;
  font-weight:500;
  line-height:1.5;
  text-align:center;
}
.new-badge.show{display:block}

/* 新しい公開版が見つかったときだけ表示 */
.version-alert{
  display:none;
  margin:12px 0 0;
  padding:12px 14px;
  border:1px solid #efcf63;
  border-radius:14px;
  background:#fff8d8;
  color:var(--ink);
  font-size:13px;
  line-height:1.6;
  text-align:center;
}
.version-alert.show{display:block}
.version-alert button{
  border:0;
  border-radius:10px;
  margin-left:6px;
  padding:7px 11px;
  background:var(--accent);
  color:#fff;
  font-weight:850;
}

.update-footer{
  margin:16px 0 4px;
  padding:10px 8px 4px;
  text-align:left;
  color:var(--sub);
  font-size:12px;
  line-height:1.7;
}
.update-summary{display:flex;justify-content:flex-start;gap:12px;flex-wrap:wrap}
.update-toggle{
  border:0;
  background:none;
  color:var(--accent);
  font:inherit;
  font-weight:850;
  padding:7px 0;
  margin-top:1px;
  border-radius:10px;
}
.update-toggle:focus-visible{outline:3px solid #5da89c55;outline-offset:2px}
.update-history{
  width:min(560px,100%);
  margin:7px 0 0;
  padding:12px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.72);
  text-align:left;
  color:var(--ink);
  font-size:12px;
}
.update-entry+ .update-entry{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.update-entry-head{font-weight:900;margin-bottom:3px}
.update-entry ul{margin:4px 0 0;padding-left:1.4em;color:var(--sub)}
.update-entry li{margin:2px 0}


.mode-status{margin:8px 0 0;text-align:center;color:var(--sub);font-size:13px;font-weight:800}
.mode-switch{display:flex;gap:8px;margin-top:12px}
.mode-switch button{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 8px;background:#fff;color:var(--sub);font-weight:850}
.mode-switch button.active{border-color:#8bb7b1;background:#edf8f5;color:#386f7d}
.mode-switch button:disabled{opacity:.48;cursor:default}
.mode-map-label{text-align:center;margin:-6px 0 12px;color:var(--sub);font-size:13px;font-weight:850}


/* =====================================================
   Ver.1.4.4 モード別表示・背景・制覇演出
   ===================================================== */
:root{
  --mode-accent:#4f8b7f;
  --mode-soft:#edf8f4;
}
body{
  transition:background .55s ease,color .4s ease;
}
body.mode-A{
  background:
    radial-gradient(circle at 18% 8%,rgba(255,255,255,.9),transparent 28%),
    linear-gradient(160deg,#e8f5ef,#eaf0f7);
}
body.mode-M{
  background:
    radial-gradient(circle at 82% 10%,rgba(255,248,225,.88),transparent 26%),
    linear-gradient(160deg,#f5eee2,#ead8c3);
}
body.mode-G{
  background:
    radial-gradient(circle at 20% 15%,rgba(121,98,180,.34),transparent 24%),
    radial-gradient(circle at 78% 18%,rgba(255,215,128,.14),transparent 18%),
    linear-gradient(160deg,#17172e,#2e2350 56%,#161c38);
}
body.mode-G::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,255,255,.55) 0 1px,transparent 1.5px);
  background-size:42px 42px,68px 68px;
  background-position:0 0,17px 29px;
  opacity:.34;
  z-index:-1;
}
body.mode-G header .brand,
body.mode-G header .pill{color:#f6f1ff}
body.mode-G header .pill{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
}

.card,.field-row,.stage-node,.mode-switch button{
  transition:background .5s ease,border-color .5s ease,box-shadow .5s ease,color .35s ease;
}

.mode-switch button.active{
  border-color:var(--mode-accent);
  background:var(--mode-soft);
  color:var(--mode-accent);
}
.map-mode-switch{margin:0 0 14px}
.quiz-mode-note{
  margin:-1px 0 8px;
  color:var(--sub);
  font-size:11px;
  font-weight:750;
}

/* 冒険者 */
body.mode-A #mapScreen{
  background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(238,249,245,.97));
  border-color:#d8eee7;
  box-shadow:0 18px 44px rgba(66,113,101,.18);
}
body.mode-A .field-row{
  background:linear-gradient(160deg,#fff,#f2faf7);
  border-color:#dcece6;
}
body.mode-A .stage-node.current{
  border-color:#5da89c;
  box-shadow:0 0 0 4px rgba(93,168,156,.15),0 8px 24px rgba(72,130,120,.14);
}

/* 師範 */
body.mode-M #mapScreen{
  background:
    linear-gradient(rgba(255,255,255,.95),rgba(255,252,246,.97)),
    repeating-linear-gradient(0deg,rgba(142,98,61,.035) 0 2px,transparent 2px 6px);
  border-color:#e5c9aa;
  box-shadow:0 18px 44px rgba(120,79,43,.22);
}
body.mode-M .field-row{
  background:linear-gradient(160deg,#fffef9,#fbf4e9);
  border-color:#e5c7a2;
}
body.mode-M .field-row.locked{
  background:linear-gradient(135deg,#eee5db,#ded0c1);
}
body.mode-M .stage-node.current{
  border-color:#b36f3f;
  background:linear-gradient(160deg,#fffefb,#f8ead8);
  box-shadow:0 0 0 4px rgba(179,111,63,.14),0 8px 24px rgba(125,78,42,.16);
}
body.mode-M .stage-node.done{
  background:#f8efe3;
  border-color:#b98758;
}
body.mode-M .stage-node.locked{
  background:#e7ddd1;
  border-color:#d3c2ae;
  color:#75695d;
}

/* 神 */
body.mode-G #mapScreen{
  background:linear-gradient(160deg,rgba(250,248,255,.97),rgba(235,229,252,.96));
  border-color:#a694d7;
  box-shadow:0 0 0 1px rgba(222,204,255,.55),0 22px 70px rgba(12,10,38,.5);
}
body.mode-G .field-row{
  background:linear-gradient(160deg,#fff,#f1ecff);
  border-color:#b7a6df;
  box-shadow:0 8px 24px rgba(80,58,135,.12);
}
body.mode-G .field-row.locked{
  background:linear-gradient(135deg,#2c2844,#171528);
  color:#c6bddf;
  border-color:#4a416a;
}
body.mode-G .field-row.locked .field-sub{color:#9e94bc}
body.mode-G .stage-node.current{
  border-color:#8265c7;
  background:linear-gradient(160deg,#fff,#eee7ff);
  box-shadow:0 0 0 4px rgba(130,101,199,.18),0 0 24px rgba(230,205,255,.65);
}
body.mode-G .stage-node.done{
  background:#eee9fb;
  border-color:#9d86d5;
}
body.mode-G .stage-node.locked{
  background:#26233b;
  border-color:#494161;
  color:#b9b0d0;
}

/* モード制覇演出 */
.mode-clear-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(18,26,33,.84);
  overflow:hidden;
}
.mode-clear-stage{
  position:relative;
  width:min(560px,100%);
  min-height:520px;
  border-radius:30px;
  background:
    radial-gradient(circle at 50% 24%,rgba(255,255,255,.98),var(--mode-soft) 48%,rgba(255,255,255,.94));
  border:2px solid var(--mode-accent);
  padding:34px 24px 25px;
  text-align:center;
  box-shadow:0 22px 80px rgba(0,0,0,.32);
  overflow:hidden;
}
.mode-clear-rays{
  position:absolute;
  inset:-45%;
  background:repeating-conic-gradient(
    from 0deg,
    color-mix(in srgb,var(--mode-accent) 20%,transparent) 0 9deg,
    transparent 9deg 18deg
  );
  opacity:.55;
}
.mode-clear-stage.animate .mode-clear-rays{animation:spinRays 12s linear infinite}
.mode-clear-content{position:relative;z-index:3}
.mode-clear-kicker{color:var(--mode-accent);font-size:12px;font-weight:950;letter-spacing:.18em;opacity:0}
.mode-clear-symbol{font-size:48px;margin-top:14px;opacity:0}
.mode-clear-icon{font-size:76px;line-height:1;margin:8px 0;opacity:0}
.mode-clear-title{margin:10px 0 4px;color:var(--mode-accent);font-size:clamp(28px,8vw,44px);line-height:1.25;opacity:0}
.mode-clear-message{font-size:17px;font-weight:900;margin-top:15px;opacity:0}
.mode-clear-unlock{
  margin:20px auto 0;
  padding:15px;
  border-radius:17px;
  border:1px solid var(--mode-accent);
  background:rgba(255,255,255,.78);
  color:var(--mode-accent);
  font-weight:950;
  opacity:0;
}
.mode-clear-action{
  position:relative;
  z-index:4;
  width:100%;
  margin-top:23px;
  border:0;
  border-radius:16px;
  padding:15px;
  background:var(--mode-accent);
  color:#fff;
  font-weight:950;
  font-size:17px;
  opacity:0;
}
.celebration-particles{position:absolute;inset:0;pointer-events:none;z-index:2}
.celebration-particle{
  position:absolute;
  top:-12%;
  opacity:0;
  animation-name:particleFall;
  animation-timing-function:ease-in;
  animation-fill-mode:forwards;
}
.mode-clear-stage.animate .mode-clear-kicker{animation:popIn .45s .12s forwards}
.mode-clear-stage.animate .mode-clear-symbol{animation:popIn .5s .38s forwards}
.mode-clear-stage.animate .mode-clear-icon{animation:heroBurst .75s .62s forwards}
.mode-clear-stage.animate .mode-clear-title{animation:popIn .55s 1.03s forwards}
.mode-clear-stage.animate .mode-clear-message{animation:popIn .45s 1.35s forwards}
.mode-clear-stage.animate .mode-clear-unlock{animation:popIn .5s 1.62s forwards}
.mode-clear-stage.animate .mode-clear-action{animation:popIn .45s 1.95s forwards}
@keyframes spinRays{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes heroBurst{0%{opacity:0;transform:scale(.15) rotate(-18deg)}55%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes particleFall{0%{opacity:0;transform:translateY(-20px) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(650px) rotate(420deg)}}
@media(max-width:520px){
  .mode-clear-stage{min-height:500px;padding:28px 18px 22px}
  body.mode-G::before{background-size:34px 34px,56px 56px}
}

</style>
</head>
<body>
<div class="app">
<header><div class="brand">🌍 地学基礎マスター</div><div class="pill" id="topPill">一本道版</div></header>

<section class="card" id="home">
<img class="logo-banner" id="logoBanner" src="logo.png?v=1.4.4" alt="地学基礎マスター"><p class="home-copy">10問ずつ、少しずつ進める地学ゲーム</p>
<div class="new-badge" id="newBadge" aria-label="新着更新"></div>
<div class="version-alert" id="versionAlert" role="status" aria-live="polite"></div>

<div class="mode-status" id="homeModeStatus">🧭 冒険者モード</div>
<div class="mode-switch" aria-label="モード選択">
  <button type="button" id="modeAButton">🧭 冒険者</button>
  <button type="button" id="modeMButton">🥋 師範</button>
  <button type="button" id="modeGButton">👑 神</button>
</div>

<div class="today">
  <div class="today-top"><div class="today-icon" id="todayIcon">🌋</div><div><div class="eyebrow">今日のステージ</div><div class="today-title" id="todayTitle"></div><div class="small" id="todaySub"></div></div></div>
  <button class="primary" id="startCurrent">10問だけやってみる</button>
</div>
<button class="secondary" id="openMap">ステージマップを見る</button>
<div class="notice">各ステージは7問以上正解するとクリアです。クリアすると次のステージが1つだけ開きます。</div>

<footer class="update-footer" aria-label="更新情報">
  <div class="update-summary">
    <span id="versionText"></span>
    <span>最終更新：<span id="updatedText"></span></span>
  </div>
  <button class="update-toggle" id="updateToggle" type="button" aria-expanded="false" aria-controls="updateHistory">更新履歴を見る▼</button>
  <div class="update-history hidden" id="updateHistory"></div>
</footer>
</section>

<section class="card hidden" id="mapScreen">
<button class="back" id="mapBack">← 今日のステージへ</button>
<div class="hero"><div class="hero-icon">🗺️</div><h1>ステージマップ</h1><p>見えている道を、少しずつ進みます。</p></div>
<div class="mode-map-label" id="mapModeStatus"></div>

<div class="mode-switch map-mode-switch" aria-label="ステージマップのモード選択">
  <button type="button" id="mapModeAButton">🧭 冒険者</button>
  <button type="button" id="mapModeMButton">🥋 師範</button>
  <button type="button" id="mapModeGButton">👑 神</button>
</div>
<div class="map" id="map"></div>
</section>

<section class="card hidden" id="quiz">
<button class="back" id="quizBack">← 今日のステージへ</button>
<div class="status"><span id="count"></span><span>🔥 <span id="streak">0</span></span></div>
<div class="progress"><div id="bar"></div></div>
<div class="pill" id="quizLabel" style="display:inline-block;margin-bottom:12px"></div>
<div class="quiz-mode-note" id="quizModeNote"></div>
<h2 id="qtext"></h2>
<div class="choices" id="choices"></div>
<div class="feedback hidden" id="feedback"></div>
<button class="primary hidden" id="next">次の問題へ</button>
</section>

<section class="card hidden" id="result">
<div class="hero"><div class="hero-icon" id="resultIcon">🎉</div><h1 id="resultTitle">結果</h1></div>
<div class="result-score" id="score"></div>
<p style="text-align:center" id="message"></p>
<div class="unlock hidden" id="unlockBox"><div style="font-size:32px">✨</div><strong id="unlockTitle"></strong><div class="small" id="unlockText"></div></div>
<div class="summary"><div><strong id="correct"></strong>正解</div><div><strong id="best"></strong>最高連続</div><div><strong id="rank"></strong>ランク</div></div>
<button class="primary" id="continueBtn">つぎへ進む</button>
<button class="secondary" id="again">もう一度</button>
<button class="secondary" id="toMap">ステージマップを見る</button>
</section>

</div>
<div class="toast" id="toast"></div>

const APP_INFO=RELEASE_INFO;
const NEW_DISPLAY_DAYS=7;

function formatUpdateDate(isoDate){
  const [y,m,d]=isoDate.split("-").map(Number);
  return `${y}/${m}/${d}`;
}

function renderUpdateHistory(){
  const history=document.getElementById("updateHistory");
  const entries=[
    {
      version:RELEASE_INFO.version,
      date:RELEASE_INFO.date,
      changes:[RELEASE_INFO.message]
    },
    ...CHANGELOG
  ];
  history.innerHTML=entries.map(entry=>{
    const items=entry.changes.map(change=>`<li>${change}</li>`).join("");
    return `
      <div class="update-entry">
        <div class="update-entry-head">Ver.${entry.version}　${formatUpdateDate(entry.date)}</div>
        <ul>${items}</ul>
      </div>`;
  }).join("");
}


function compareVersions(a,b){
  const pa=String(a).split(".").map(n=>Number(n)||0);
  const pb=String(b).split(".").map(n=>Number(n)||0);
  const length=Math.max(pa.length,pb.length);
  for(let i=0;i<length;i++){
    const av=pa[i]||0;
    const bv=pb[i]||0;
    if(av>bv)return 1;
    if(av<bv)return -1;
  }
  return 0;
}

function openLatestVersion(latestVersion){
  const url=new URL(window.location.href);
  url.searchParams.set("v",latestVersion);
  window.location.replace(url.toString());
}

async function checkLatestVersion(){
  try{
    // 時刻を付け、古いversion.jsonがキャッシュから返されるのを防ぐ。
    const versionUrl=`version.json?t=${Date.now()}`;
    const response=await fetch(versionUrl,{cache:"no-store"});
    if(!response.ok)return;

    const latest=await response.json();
    if(!latest||!latest.version)return;

    if(compareVersions(latest.version,RELEASE_INFO.version)>0){
      const alert=document.getElementById("versionAlert");
      const dateText=latest.date?`（${formatUpdateDate(latest.date)}）`:"";
      alert.innerHTML=`新しいバージョン Ver.${latest.version}${dateText} が公開されています。<button type="button" id="openLatestButton">最新版を開く</button>`;
      alert.classList.add("show");
      document.getElementById("openLatestButton").addEventListener("click",()=>openLatestVersion(latest.version));
    }
  }catch(error){
    // オフライン時やversion.jsonを取得できない場合でも、ゲーム本体はそのまま動かす。
    console.info("最新版の確認をスキップしました。");
  }
}

function setupUpdateInfo(){
  document.getElementById("versionText").textContent=`Ver.${APP_INFO.version}`;
  document.getElementById("updatedText").textContent=formatUpdateDate(APP_INFO.date);
  renderUpdateHistory();

  // 最新更新日の0:00から7日間だけ、説明文の下に最新項目を表示する。
  const [y,m,d]=APP_INFO.date.split("-").map(Number);
  const updatedAt=new Date(y,m-1,d);
  const expiresAt=new Date(updatedAt);
  expiresAt.setDate(expiresAt.getDate()+NEW_DISPLAY_DAYS);
  const now=new Date();

  if(now>=updatedAt && now<expiresAt){
    const newBadge=document.getElementById("newBadge");
    const latestUpdateText=APP_INFO.message||"更新しました";
    newBadge.textContent=`🆕 ${latestUpdateText}（${formatUpdateDate(APP_INFO.date)}）`;
    newBadge.classList.add("show");
  }

  const toggle=document.getElementById("updateToggle");
  const history=document.getElementById("updateHistory");
  toggle.addEventListener("click",()=>{
    const willOpen=history.classList.contains("hidden");
    history.classList.toggle("hidden",!willOpen);
    toggle.textContent=willOpen?"更新履歴を閉じる▲":"更新履歴を見る▼";
    toggle.setAttribute("aria-expanded",String(willOpen));
  });
}

const PASS=7;
const QUESTION_PACKS={A:QUESTION_PACK_A,M:QUESTION_PACK_M,G:QUESTION_PACK_G};
let currentPack="A";
let fields=QUESTION_PACKS.A.fields;
let fieldIndex=0,stageIndex=0,questions=[],idx=0,score=0,streak=0,best=0,answered=false;
let pendingModeClear=null;
let modeClearDestination="home";
const $=id=>document.getElementById(id);

function show(id){["home","mapScreen","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));}

function emptyPackProgress(){return {field:0,stage:0,scores:{},complete:false};}
function getGameState(){
  try{
    const saved=JSON.parse(localStorage.getItem("geo_master_packs_v1"));
    if(saved&&saved.packs){
      saved.packs.A=saved.packs.A||emptyPackProgress();
      saved.packs.M=saved.packs.M||emptyPackProgress();
      saved.packs.G=saved.packs.G||emptyPackProgress();
      saved.unlocked=saved.unlocked||{A:true,M:false,G:false};
      saved.unlocked.A=true;
      saved.unlocked.M=Boolean(saved.unlocked.M);
      saved.unlocked.G=Boolean(saved.unlocked.G);
      return saved;
    }
  }catch(e){}
  let legacy=null;
  try{legacy=JSON.parse(localStorage.getItem("geo_master_path_v1"));}catch(e){}
  return {
    currentPack:"A",
    unlocked:{A:true,M:false,G:false},
    packs:{
      A:legacy||emptyPackProgress(),
      M:emptyPackProgress(),
      G:emptyPackProgress()
    }
  };
}
function saveGameState(state){
  localStorage.setItem("geo_master_packs_v1",JSON.stringify(state));
}
function lockedMessage(code){
  if(code==="M")return "冒険者モードの15ステージをクリアすると師範モードが開きます。";
  if(code==="G")return "師範モードの15ステージをクリアすると神モードが開きます。";
  return "このモードはまだ解放されていません。";
}
function setPack(code,stayOnMap=false){
  const state=getGameState();
  if(!state.unlocked[code]){
    toast(lockedMessage(code));
    return;
  }
  state.currentPack=code;
  saveGameState(state);
  currentPack=code;
  fields=QUESTION_PACKS[code].fields;
  renderHome();
  if(stayOnMap){
    renderMap();
    show("mapScreen");
  }
}
function packInfo(){return QUESTION_PACKS[currentPack];}
function getProgress(){return getGameState().packs[currentPack]||emptyPackProgress();}
function saveProgress(progress){
  const state=getGameState();
  state.packs[currentPack]=progress;
  state.currentPack=currentPack;
  saveGameState(state);
}
function key(f,s){return f+"-"+s}
function current(){
  const p=getProgress();
  return {f:Math.min(Number(p.field)||0,fields.length-1),s:Math.min(Number(p.stage)||0,2),p};
}
function updateModeUI(){
  const state=getGameState();
  const info=packInfo();
  const visual=getModePresentation(currentPack);

  document.documentElement.style.setProperty("--mode-accent",visual.accent);
  document.documentElement.style.setProperty("--mode-soft",visual.accentSoft);
  document.body.classList.remove("mode-A","mode-M","mode-G");
  document.body.classList.add("mode-"+currentPack);

  $("homeModeStatus").textContent=`${info.icon} ${info.displayName}モード`;
  $("mapModeStatus").textContent=`${info.icon} ${info.displayName}モードのステージマップ`;

  ["A","M","G"].forEach(code=>{
    const homeButton=$("mode"+code+"Button");
    const mapButton=$("mapMode"+code+"Button");
    const unlocked=Boolean(state.unlocked[code]);

    homeButton.classList.toggle("active",currentPack===code);
    homeButton.disabled=!unlocked;

    mapButton.classList.toggle("active",currentPack===code);
    mapButton.disabled=!unlocked;
  });

  $("modeAButton").textContent="🧭 冒険者";
  $("modeMButton").textContent=state.unlocked.M?"🥋 師範":"🔒 師範";
  $("modeGButton").textContent=state.unlocked.G?"👑 神":"🔒 神";

  $("mapModeAButton").textContent="🧭 冒険者";
  $("mapModeMButton").textContent=state.unlocked.M?"🥋 師範":"🔒 師範";
  $("mapModeGButton").textContent=state.unlocked.G?"👑 神":"🔒 神";
}
function renderHome(){
  const state=getGameState();
  currentPack=state.currentPack&&state.unlocked[state.currentPack]?state.currentPack:"A";
  fields=QUESTION_PACKS[currentPack].fields;
  const c=current(),f=fields[c.f],s=f.stages[c.s];
  $("todayIcon").textContent=f.icon;
  $("todayTitle").textContent=f.name+" "+s.name;
  $("todaySub").textContent="クリア条件：10問中7問以上";
  $("topPill").textContent=packInfo().icon+" "+packInfo().displayName;
  updateModeUI();
}
function isUnlocked(fi,si){
  const c=current();
  return fi<c.f || (fi===c.f && si<=c.s);
}
function isDone(fi,si){
  const p=getProgress();return Number(p.scores[key(fi,si)]||0)>=PASS;
}
function toast(msg){$("toast").textContent=msg;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function renderMap(){
  const c=current();updateModeUI();const visual=getModePresentation(currentPack);$("map").innerHTML="";
  fields.forEach((f,fi)=>{
    const fieldUnlocked=fi<=c.f;
    const row=document.createElement("div");row.className="field-row"+(fieldUnlocked?"":" locked");
    const head=document.createElement("div");head.className="field-head";
    head.innerHTML=fieldUnlocked?`<div class="field-icon">${f.icon}</div><div><div class="field-name">${f.name}</div><div class="field-sub">${f.subtitle}</div></div>`:`<div class="field-icon">${visual.lockedIcon}</div><div><div class="field-name">${visual.lockedTitle}</div><div class="field-sub">${visual.lockedNote}</div></div>`;
    row.appendChild(head);
    const track=document.createElement("div");track.className="stage-track";
    f.stages.forEach((s,si)=>{
      const unlocked=isUnlocked(fi,si),done=isDone(fi,si),cur=fi===c.f&&si===c.s;
      const b=document.createElement("button");b.className="stage-node "+(done?"done":cur?"current":unlocked?"":"locked");
      if(unlocked){
        b.innerHTML=`<div class="node-icon">${done?"✅":cur?visual.currentIcon:"◯"}</div><div class="node-title">${s.name}</div><div class="node-note">${done?"クリア":cur?"挑戦できます":"解放済み"}</div>`;
        b.onclick=()=>start(fi,si);
      }else{
        b.innerHTML=`<div class="node-icon">${visual.lockedIcon}</div><div class="node-title">${visual.lockedTitle}</div><div class="node-note">LOCK</div>`;
        b.onclick=()=>toast(fi>c.f?"現在のフィールドをクリアすると開きます。":"ひとつ前のステージをクリアすると開きます。");
      }
      track.appendChild(b);
    });
    row.appendChild(track);$("map").appendChild(row);
  });
}
function shuffleArray(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function start(fi,si){
  fieldIndex=fi;stageIndex=si;
  questions=shuffleArray(fields[fi].stages[si].questions).map(q=>{
    const choices=shuffleArray(q.choices.map((text,i)=>({text,correct:i===q.answer})));
    return {...q,choices:choices.map(item=>item.text),answer:choices.findIndex(item=>item.correct)};
  });
  idx=0;score=0;streak=0;best=0;
  updateModeUI();
  $("topPill").textContent=packInfo().icon+" "+packInfo().displayName;
  show("quiz");showQ();
}
function showQ(){
  answered=false;const q=questions[idx];
  $("count").textContent=`第${idx+1}問 / 10問`;
  $("streak").textContent=streak;$("bar").style.width=(idx*10)+"%";
  $("quizLabel").textContent=fields[fieldIndex].stages[stageIndex].name;
  $("quizModeNote").textContent=`${packInfo().icon} ${packInfo().displayName}モード`;
  $("qtext").textContent=q.question;$("choices").innerHTML="";
  q.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+c;b.onclick=()=>answer(i);$("choices").appendChild(b);});
  $("feedback").className="feedback hidden";$("next").classList.add("hidden");
}
function answer(sel){
  if(answered)return;answered=true;const q=questions[idx];const btns=[...document.querySelectorAll(".choice")];
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add("correct");if(i===sel&&sel!==q.answer)b.classList.add("wrong");});
  const ok=sel===q.answer;if(ok){score++;streak++;best=Math.max(best,streak)}else streak=0;
  $("streak").textContent=streak;$("bar").style.width=((idx+1)*10)+"%";
  $("feedback").className="feedback "+(ok?"good":"bad");
  $("feedback").innerHTML=`<strong>${ok?"正解！":"おしい！ 正解は「"+q.choices[q.answer]+"」"}</strong>${q.explanation}`;
  $("next").textContent=idx===9?"結果を見る":"次の問題へ";$("next").classList.remove("hidden");
}
function finish(){
  let rank="C",icon="🌱",msg="今日はここまででも大丈夫。もう一度ならすぐ挑戦できます。";
  if(score===10){rank="S";icon="🏆";msg="全問正解です！"}else if(score>=8){rank="A";icon="🌟";msg="クリアです。次の道が開きました！"}else if(score>=PASS){rank="B";icon="🔓";msg="クリアです。次の道が開きました！"}

  const completedPack=currentPack;
  const p=getProgress(),k=key(fieldIndex,stageIndex),old=Number(p.scores[k]||0);
  p.scores[k]=Math.max(old,score);
  let unlockedText="",advanced=false,packCompleted=false,nextPack=null;
  pendingModeClear=null;

  if(score>=PASS && fieldIndex===p.field && stageIndex===p.stage){
    if(stageIndex<2){
      p.stage++;unlockedText=fields[fieldIndex].stages[p.stage].name+" が解放されました。";advanced=true;
    }else if(fieldIndex<fields.length-1){
      p.field++;p.stage=0;unlockedText=fields[p.field].name+"フィールドが解放されました。";advanced=true;
    }else{
      p.complete=true;packCompleted=true;advanced=true;
      const state=getGameState();
      state.packs[completedPack]=p;

      if(completedPack==="A"){
        state.unlocked.M=true;
        state.currentPack="M";
        nextPack="M";
        unlockedText="冒険者モードを制覇しました！ 師範モードが解放されました。";
      }else if(completedPack==="M"){
        state.unlocked.G=true;
        state.currentPack="G";
        nextPack="G";
        unlockedText="師範モードを制覇しました！ 神モードが解放されました。";
      }else{
        state.currentPack="G";
        unlockedText="神モードを制覇しました！ 全45ステージ完全制覇です。";
      }
      saveGameState(state);
      pendingModeClear={
        code:completedPack,
        nextPack,
        message:completedPack==="G"?"全45ステージを制覇しました。":"15ステージを制覇しました。",
        unlockMessage:unlockedText
      };
    }
  }

  if(!packCompleted)saveProgress(p);

  const completedInfo=QUESTION_PACKS[completedPack];
  $("resultIcon").textContent=packCompleted?(completedPack==="G"?"👑":"🎊"):icon;
  $("resultTitle").textContent=packCompleted?completedInfo.displayName+"モード クリア！":fields[fieldIndex].name+" 結果";
  $("score").textContent=(score*10)+"点";$("message").textContent=msg;
  $("correct").textContent=score;$("best").textContent=best;$("rank").textContent=rank;
  $("unlockBox").classList.toggle("hidden",!advanced);
  $("unlockTitle").textContent=advanced?(packCompleted?(completedPack==="G"?"全モード制覇！":"モード制覇！"):"新しい道が開きました！"):"";
  $("unlockText").textContent=unlockedText;

  if(nextPack){
    $("continueBtn").textContent=QUESTION_PACKS[nextPack].displayName+"モードへ進む";
  }else if(packCompleted&&completedPack==="G"){
    $("continueBtn").textContent="神モードのステージマップを見る";
  }else{
    $("continueBtn").textContent=score>=PASS?"つぎの10問へ":"同じ10問にもう一度挑戦";
  }

  renderHome();show("result");
}
$("next").onclick=()=>{idx++;idx<10?showQ():finish()};
$("startCurrent").onclick=()=>{const c=current();start(c.f,c.s)};
$("openMap").onclick=()=>{renderMap();show("mapScreen")};
$("mapBack").onclick=()=>{renderHome();show("home")};
$("quizBack").onclick=()=>{renderHome();show("home")};
$("continueBtn").onclick=()=>{
  if(pendingModeClear){
    const clearInfo=pendingModeClear;
    pendingModeClear=null;
    modeClearDestination=clearInfo.nextPack?"home":"map";
    playModeClearEffect(clearInfo.code,{
      message:clearInfo.message,
      unlockMessage:clearInfo.unlockMessage,
      actionLabel:clearInfo.nextPack
        ? QUESTION_PACKS[clearInfo.nextPack].displayName+"モードへ進む"
        : "神モードのステージマップへ"
    });
    return;
  }
  const p=getProgress();
  if(p.complete){renderMap();show("mapScreen");return;}
  const c=current();start(c.f,c.s);
};
$("again").onclick=()=>start(fieldIndex,stageIndex);
$("toMap").onclick=()=>{renderMap();show("mapScreen")};
$("modeAButton").onclick=()=>setPack("A");
$("modeMButton").onclick=()=>setPack("M");
$("modeGButton").onclick=()=>setPack("G");
$("mapModeAButton").onclick=()=>setPack("A",true);
$("mapModeMButton").onclick=()=>setPack("M",true);
$("mapModeGButton").onclick=()=>setPack("G",true);
$("modeClearAction").onclick=()=>{
  closeModeClearEffect();
  if(modeClearDestination==="map"){
    renderMap();
    show("mapScreen");
  }else{
    renderHome();
    show("home");
  }
};

setupUpdateInfo();
checkLatestVersion();
renderHome();
</script>
